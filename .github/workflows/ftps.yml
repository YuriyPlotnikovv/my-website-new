name: Deploy my-website-new to Beget via FTP

on:
    push:
        branches: [ "main" ]
        paths-ignore:
            - '.info/**'
            - '.github/workflows/generateReadme.yml'
            - 'README.md'
    pull_request:
        branches: [ "main" ]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none

            - name: Install PHP dependencies
              run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Cache Node.js modules
              uses: actions/cache@v6
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-

            - name: Install dependencies
              run: npm install

            - name: Build project
              run: npm run build

            - name: Generate .env
              env:
                  OWNER_ID: ${{ secrets.OWNER_ID }}
                  ALBUM_ID: ${{ secrets.ALBUM_ID }}
                  VK_API_KEY: ${{ secrets.VK_API_KEY }}
                  GIT_API_KEY: ${{ secrets.GIT_API_KEY }}
                  CAPTCHA_PUBLIC_API_KEY: ${{ secrets.CAPTCHA_PUBLIC_API_KEY }}
                  CAPTCHA_PRIVATE_API_KEY: ${{ secrets.CAPTCHA_PRIVATE_API_KEY }}
                  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
                  GITHUB_WORKSPACE: ${{ github.workspace }}
              run: node .github/scripts/generateEnv.js

            - name: SFTP Deploy
              uses: SamKirkland/FTP-Deploy-Action@v4.3.5
              with:
                  server: ${{ secrets.SFTP_SERVER }}
                  username: ${{ secrets.SFTP_USER }}
                  password: ${{ secrets.SFTP_PASSWORD }}
                  protocol: ftps
                  local-dir: ./
                  exclude: |
                      **/.git*
                      **/.git*/**
                      **/.github/**
                      **/.info/**
                      **/node_modules/**
                      src/**
                      package.json
                      package-lock.json
                      gulpfile.mjs
                      composer.json
                      composer.lock
                      .env.example
                      .editorconfig
                      README.md
